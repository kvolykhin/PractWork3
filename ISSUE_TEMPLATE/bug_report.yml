name: название шаблона 
description: описание шаблона 
title: "[Ошибка]: " 
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что помогаете улучшать проект! Перед отправкой отчёта обязательно проверьте, нет ли уже похожего дефекта в Issues.
  
  - type: checkboxes
    id: existing-check
    attributes:
      label: Подтверждение
      description: Отметьте этот пункт, если вы проверили существующие отчёты и не нашли дубликата.
      options:
        - label: Я проверил(а) существующие отчёты о дефектах и не нашёл(а) дубликата
          required: true

  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Кратко опишите суть проблемы. Что происходит и где?
      placeholder: Например: «При нажатии кнопки „Сохранить“ страница зависает»
      validations:
        required: true

  - type: textarea
    id: preconditions
    attributes:
      label: Предусловия
      description: В каком состоянии системы/окружения проявляется дефект?
      placeholder: Например: «Пользователь авторизован, открыт раздел „Профиль“»
      validations:
        required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Опишите чёткие шаги, которые приводят к дефекту. Лучше нумерованным списком.
      placeholder: |
        1. Открыть страницу «Настройки»
        2. Нажать кнопку «Изменить пароль»
        3. Ввести пароль короче 6 символов
        4. Нажать «Сохранить»
      validations:
        required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
      description: Что должно было произойти по задумке?
      placeholder: «Должно появиться сообщение об ошибке: „Пароль должен содержать не менее 6 символов“»
      validations:
        required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
      description: Что происходит на самом деле?
      placeholder: «Ничего не происходит, кнопка неактивна, ошибок нет»
      validations:
        required: true

  - type: dropdown
    id: priority
    attributes:
      label: Приоритет
      description: Насколько срочно нужно исправить дефект?
      options:
        - Критический (блокирует работу основной функциональности)
        - Высокий (серьёзно мешает работе, но есть обходные пути)
        - Средний (заметен, но не сильно мешает)
        - Низкий (косметический или редкий случай)
      validations:
        required: true

  - type: dropdown
    id: severity
    attributes:
      label: Серьёзность
      description: Какое влияние дефект оказывает на пользователя/систему?
      options:
        - Блокирующий (полностью невозможно использовать функционал)
        - Критический (серьёзные искажения данных/ошибки)
        - Значительный (некорректная работа части функционала)
        - Незначительный (мелкие недочёты, опечатки)
      validations:
        required: true

  - type: textarea
    id: attachments
    attributes:
      label: Скриншоты / Доп. материалы
      description: Прикрепите скриншоты, логи, ссылки на видео и т.п.
      placeholder: «Можно просто перетащить файлы в это поле или вставить ссылки»
      validations:
        required: false
